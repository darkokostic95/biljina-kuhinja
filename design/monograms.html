<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biljina Kuhinja — monogram</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6EFE4; --paper:#FFFBF5; --ink:#3B2A20; --main:#C0643B; --acc:#E0A53C; }
  * { box-sizing:border-box; }
  body { margin:0; background:#ebe4d8; color:var(--ink); font-family:"Bricolage Grotesque", sans-serif; }
  h1 { font-size:32px; font-weight:800; text-align:center; margin:22px 0 2px; letter-spacing:-.5px; }
  p.lead { text-align:center; margin:0 0 18px; opacity:.7; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; max-width:1100px; margin:0 auto; padding:0 16px 28px; }
  .v { background:var(--paper); border-radius:16px; padding:16px; box-shadow:0 8px 24px #3b2a2012; }
  .row { display:flex; align-items:center; gap:14px; }
  .row svg.mono { width:62%; height:auto; }
  .side { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .side .tile { width:84px; height:84px; border-radius:20px; overflow:hidden; }
  .side .tile svg, .side .fav svg { width:100%; height:100%; display:block; }
  .side .fav { width:34px; height:34px; }
  .lock { display:flex; align-items:center; gap:10px; margin-top:6px; padding-top:12px; border-top:1px dashed #3b2a2025; }
  .lock svg { width:62px; height:auto; }
  .lock b { font-size:28px; font-weight:800; letter-spacing:-1px; }
  .v h2 { font-size:17px; font-weight:800; margin:12px 0 2px; }
  .v p { font-size:13.5px; margin:0; opacity:.78; line-height:1.4; }
  .line * { fill:none !important; stroke:#C0643B !important; stroke-width:5 !important; }
  .line .keep { fill:#C0643B !important; stroke:none !important; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>B i K napravljeni od kuhinje</h1>
<p class="lead">Slova nisu ispisana, nego sastavljena od kape, escajga i kuhinjskog pribora.</p>
<div class="grid" id="g"></div>
<script>
const C = { paper:"#FFFBF5", ink:"#3B2A20", main:"#C0643B", acc:"#E0A53C", crust:"#E7B27A", steel:"#E9E4DC", white:"#FFFFFF" };
const S = `stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"`;

/* ---------- B pieces (box x 18..120, y 14..186) ---------- */
// B = chef's hat lying on its side: the band is the stem, the two puffs are the bowls
const B_hat = () => `
  <path d="M52 26 C66 10 98 16 96 42 C116 50 110 94 74 98 L52 98 Z" fill="${C.white}" ${S}/>
  <path d="M52 98 C86 88 116 100 108 124 C128 136 120 180 82 178 L52 178 Z" fill="${C.white}" ${S}/>
  <path d="M54 50 C66 52 74 58 80 66 M54 130 C68 132 80 140 88 150" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" opacity=".35"/>
  <rect x="22" y="22" width="32" height="160" rx="9" fill="${C.main}" ${S}/>
  <path d="M38 34 V170" stroke="${C.paper}" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round" opacity=".7"/>`;

// B = rolling pin (stem) + two loaves of bread (bowls)
const B_pin = () => `
  <path d="M50 30 C90 26 106 46 102 66 C100 90 80 100 50 100 Z" fill="${C.crust}" ${S}/>
  <path d="M50 102 C98 98 120 118 112 142 C106 166 86 172 50 170 Z" fill="${C.crust}" ${S}/>
  <path d="M64 48 L76 60 M78 42 L90 56 M66 120 L80 134 M82 114 L96 130 M70 146 L80 156" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>
  <rect x="31" y="10" width="14" height="26" rx="7" fill="${C.acc}" ${S}/>
  <rect x="31" y="164" width="14" height="26" rx="7" fill="${C.acc}" ${S}/>
  <rect x="24" y="30" width="28" height="140" rx="10" fill="${C.acc}" ${S}/>
  <path d="M33 44 V156" stroke="${C.white}" stroke-width="3" stroke-linecap="round" opacity=".5"/>`;

/* ---------- K pieces (stem around x 150, arms from (158,112)) ---------- */
const fork = () => `
  <g fill="${C.steel}" ${S}>
    <rect x="133" y="18" width="7" height="44" rx="3.5"/><rect x="143" y="18" width="7" height="44" rx="3.5"/>
    <rect x="153" y="18" width="7" height="44" rx="3.5"/><rect x="163" y="18" width="7" height="44" rx="3.5"/>
    <path d="M133 56 H170 V62 Q170 80 158 86 H145 Q133 80 133 62 Z"/>
    <rect x="144" y="84" width="15" height="98" rx="7.5"/>
  </g>`;
const woodenSpoon = () => `
  <g fill="${C.acc}" ${S}>
    <ellipse cx="151" cy="42" rx="16" ry="25"/>
    <rect x="145" y="64" width="13" height="118" rx="6.5"/>
  </g>
  <ellipse cx="151" cy="42" rx="8" ry="14" fill="${C.ink}" opacity=".12"/>`;
// upper arm: knife
const knife = () => `
  <g transform="translate(160 110) rotate(33)">
    <rect x="-7" y="-38" width="14" height="38" rx="7" fill="${C.main}" ${S}/>
    <path d="M-7 -38 V-90 Q-7 -106 10 -108 Q12 -70 7 -38 Z" fill="${C.steel}" ${S}/>
  </g>`;
// lower arm: spoon
const spoon = () => `
  <g transform="translate(160 116) rotate(139)">
    <rect x="-6" y="-48" width="12" height="48" rx="6" fill="${C.steel}" ${S}/>
    <ellipse cx="0" cy="-66" rx="15" ry="21" fill="${C.steel}" ${S}/>
  </g>`;
// upper arm: whisk
const whisk = () => `
  <g transform="translate(160 110) rotate(33)">
    <path d="M0 -36 C-22 -62 -18 -100 0 -106 C18 -100 22 -62 0 -36 Z" fill="${C.white}" ${S}/>
    <path d="M0 -36 C-9 -62 -8 -98 0 -106 C8 -98 9 -62 0 -36" fill="none" stroke="${C.ink}" stroke-width="3.5"/>
    <rect x="-6" y="-40" width="12" height="40" rx="6" fill="${C.main}" ${S}/>
  </g>`;
// lower arm: spatula
const spatula = () => `
  <g transform="translate(160 116) rotate(139)">
    <rect x="-6" y="-42" width="12" height="42" rx="6" fill="${C.main}" ${S}/>
    <rect x="-15" y="-86" width="30" height="46" rx="8" fill="${C.steel}" ${S}/>
    <path d="M-5 -78 V-50 M5 -78 V-50" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round"/>
  </g>`;

const V = [
  { n:"1 · Kapa + escajg", d:"B je kuvarska kapa položena na stranu: traka je uspravna crta, a dva „oblačića“ kape su stomaci slova B. K je viljuška, a nož i kašika su kose crte.",
    art:() => B_hat() + fork() + knife() + spoon() },
  { n:"2 · Kapa + pribor za kolače", d:"Ista kapa kao B. K je drvena varjača, mutilica i lopatica. Više „kolači i torte“, a to je većina njenih recepata.",
    art:() => B_hat() + woodenSpoon() + whisk() + spatula() },
  { n:"3 · Oklagija + hleb", d:"B je oklagija sa dve vekne hleba, K je varjača sa mutilicom i lopaticom. Topao, „pekarski“ znak.",
    art:() => B_pin() + woodenSpoon() + whisk() + spatula() },
  { n:"4 · Linijski (varijanta od 1)", d:"Isti crtež kao 1, ali jednom linijom u terakoti. Čistije i modernije, lepo izgleda i sitno.",
    art:() => B_hat() + fork() + knife() + spoon(), line:true },
];

const mono = (v, cls = "") => `<svg class="${cls}" viewBox="8 4 224 194"><g class="${v.line ? "line" : ""}">${v.art()}</g></svg>`;
const tile = (v) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${v.line ? C.paper : C.main}"/><g transform="translate(9 12) scale(.36)"><g class="${v.line ? "line" : ""}">${v.art()}</g></g></svg>`;

document.getElementById('g').innerHTML = V.map(v => `
  <div class="v">
    <div class="row">
      ${mono(v, "mono")}
      <div class="side"><div class="tile">${tile(v)}</div><div class="fav">${mono(v)}</div></div>
    </div>
    <div class="lock">${mono(v)}<b>Biljina Kuhinja</b></div>
    <h2>${v.n}</h2><p>${v.d}</p>
  </div>`).join('');
</script>
</body>
</html>
