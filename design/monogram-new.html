<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biljina Kuhinja — novi BK</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#ebe4d8; color:#3B2A20; font-family:"Bricolage Grotesque", sans-serif; }
  h1 { font-size:32px; font-weight:800; text-align:center; margin:22px 0 2px; letter-spacing:-.5px; }
  p.lead { text-align:center; margin:0 0 18px; opacity:.7; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; max-width:1180px; margin:0 auto; padding:0 16px 28px; }
  .v { background:#FFFBF5; border-radius:16px; padding:14px; box-shadow:0 8px 24px #3b2a2012; }
  .v svg.main { width:100%; height:auto; display:block; border-radius:12px; }
  .small { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .small .tile { width:52px; height:52px; border-radius:13px; overflow:hidden; flex:none; }
  .small svg { width:100%; height:100%; display:block; }
  .small .fav { width:28px; height:28px; flex:none; }
  .v h2 { font-size:16px; font-weight:800; margin:10px 0 2px; }
  .v p { font-size:13px; margin:0; opacity:.78; line-height:1.38; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1>Nove ideje · B i K od hrane i kuhinje</h1>
<p class="lead">Isti stil (boje, debele konture), ali potpuno drugi predmeti. Slova se dodiruju i čine jedan znak.</p>
<div class="grid" id="g"></div>
<script>
const C = { bg:"#F6EFE4", paper:"#FFFBF5", ink:"#3B2A20", main:"#C0643B", acc:"#E0A53C", crust:"#E7B27A", dough:"#F6E2C4",
            green:"#8FA35A", onion:"#9C3B4E", onionL:"#D9A0AE", carrot:"#E07A3B", chili:"#C4362B", pasta:"#F3D27A", steel:"#E9E4DC", icing:"#E58F7A", choc:"#6B4430" };
const FONT = "Bricolage Grotesque";
const S = (w = 4.5) => `stroke="${C.ink}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

// a "rope" stroke: ink outline + colour + texture
const rope = (d, col, w = 18, tex = true) => `
  <path d="${d}" fill="none" stroke="${C.ink}" stroke-width="${w + 9}" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>
  ${tex ? `<path d="${d}" fill="none" stroke="#C98A4B" stroke-width="${w}" stroke-dasharray="3 10" stroke-linejoin="round" opacity=".55"/>
  <path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-dasharray="0.1 17" stroke-linecap="round" opacity=".9"/>` : ""}`;

const V = [
  { n:"N1 · Pletenica od testa", d:"B i K su ispleteni od testa, kao slova od pletenice za slavu, sa susamom. K se naslanja na B.",
    art:() => `
      ${rope("M34 24 C84 16 106 36 100 60 C96 84 76 98 40 100 C100 96 124 118 114 146 C106 172 82 182 34 182 Z", C.crust)}
      ${rope("M128 22 V182", C.crust)}
      ${rope("M132 104 L204 26", C.crust)}
      ${rope("M134 106 L208 182", C.crust)}` },

  { n:"N2 · Špagete na viljušci", d:"Viljuška je uspravna crta slova B, a jedna duga špageta se namotava u B i nastavlja u K. Na kraju ćufte.",
    art:() => `
      <g fill="${C.steel}" ${S()}>
        <rect x="18" y="12" width="6" height="36" rx="3"/><rect x="27" y="12" width="6" height="36" rx="3"/><rect x="36" y="12" width="6" height="36" rx="3"/><rect x="45" y="12" width="6" height="36" rx="3"/>
        <path d="M18 44 H51 V50 Q51 64 41 70 H28 Q18 64 18 50 Z"/><rect x="28" y="68" width="13" height="120" rx="6.5"/>
      </g>
      ${rope("M44 32 C92 22 108 50 94 76 C86 92 66 98 46 100 C104 96 124 122 110 150 C100 172 72 182 46 180 C74 198 118 198 130 182 L130 30 C132 60 134 88 134 104 L200 30", C.pasta, 9, false)}
      ${rope("M138 110 C160 134 180 156 196 172", C.pasta, 9, false)}
      <circle cx="204" cy="180" r="15" fill="${C.main}" ${S()}/><circle cx="199" cy="175" r="4" fill="#fff" opacity=".35"/>` },

  { n:"N3 · Bašta", d:"B je mladi luk sa dve polovine crnog luka, K je šargarepa sa dve ljute papričice. Za sva njena slana jela i zimnicu.",
    art:() => `
      <path d="M50 30 C98 24 112 62 98 82 C88 98 68 100 50 100 Z" fill="${C.onion}" ${S()}/>
      <path d="M50 46 C80 44 92 64 84 78 C78 88 66 90 50 90 M50 62 C68 62 76 70 72 78" fill="none" stroke="${C.onionL}" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M50 102 C108 96 124 130 112 152 C102 172 78 180 50 180 Z" fill="${C.onion}" ${S()}/>
      <path d="M50 118 C90 114 104 134 98 152 C92 164 74 168 50 168 M50 136 C76 134 86 146 82 156" fill="none" stroke="${C.onionL}" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M30 34 C22 18 18 8 22 2 M40 34 C44 16 52 8 58 4" fill="none" stroke="${C.green}" stroke-width="7" stroke-linecap="round"/>
      <rect x="24" y="28" width="26" height="128" rx="11" fill="${C.green}" ${S()}/>
      <path d="M24 148 H50 V172 Q50 186 37 186 Q24 186 24 172 Z" fill="#FFFFFF" ${S()}/>
      <path d="M31 188 L28 196 M37 189 V197 M43 188 L46 196" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(166 108) rotate(36)"><path d="M0 0 C-10 -24 -12 -60 2 -84 C10 -70 12 -30 0 0 Z" fill="${C.chili}" ${S()}/><path d="M-6 2 h12" stroke="${C.green}" stroke-width="7" stroke-linecap="round"/></g>
      <g transform="translate(166 116) rotate(140)"><path d="M0 0 C-10 -24 -12 -60 2 -84 C10 -70 12 -30 0 0 Z" fill="${C.chili}" ${S()}/><path d="M-6 2 h12" stroke="${C.green}" stroke-width="7" stroke-linecap="round"/></g>
      <path d="M140 30 C132 16 126 10 120 8 M146 30 C146 14 150 6 156 2 M152 30 C160 18 168 14 174 14" fill="none" stroke="${C.green}" stroke-width="6" stroke-linecap="round"/>
      <path d="M134 30 H158 C160 80 154 150 146 188 C138 150 132 80 134 30 Z" fill="${C.carrot}" ${S()}/>
      <path d="M137 60 h8 M150 84 h6 M139 112 h7 M150 138 h5" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>` },

  { n:"N4 · Pecivo na plehu", d:"Slova su složena od peciva na plehu: B od štapa hleba i dve zemičke, K od štapa i dve kiflice.",
    art:() => `
      <rect x="-6" y="0" width="252" height="200" rx="18" fill="#B9AFA4" ${S()}/>
      <rect x="6" y="12" width="228" height="176" rx="10" fill="#CFC6BB"/>
      <circle cx="74" cy="62" r="34" fill="${C.crust}" ${S()}/><path d="M62 52 a14 14 0 0 1 22 0" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" opacity=".45"/>
      <circle cx="80" cy="140" r="40" fill="${C.crust}" ${S()}/><path d="M66 128 a16 16 0 0 1 26 0" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" opacity=".45"/>
      <rect x="28" y="22" width="30" height="160" rx="15" fill="#D9945A" ${S()}/>
      <path d="M36 44 l14 -10 M36 74 l14 -10 M36 104 l14 -10 M36 134 l14 -10 M36 164 l14 -10" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" opacity=".45"/>
      <g transform="translate(150 106) rotate(38)"><path d="M-12 0 C-16 -40 -8 -78 0 -88 C8 -78 16 -40 12 0 Q0 8 -12 0 Z" fill="${C.crust}" ${S()}/><path d="M-12 -24 Q0 -18 12 -24 M-11 -48 Q0 -42 11 -48 M-7 -70 Q0 -65 7 -70" fill="none" stroke="${C.ink}" stroke-width="3" opacity=".45"/></g>
      <g transform="translate(150 112) rotate(140)"><path d="M-12 0 C-16 -40 -8 -78 0 -88 C8 -78 16 -40 12 0 Q0 8 -12 0 Z" fill="${C.crust}" ${S()}/><path d="M-12 -24 Q0 -18 12 -24 M-11 -48 Q0 -42 11 -48 M-7 -70 Q0 -65 7 -70" fill="none" stroke="${C.ink}" stroke-width="3" opacity=".45"/></g>
      <rect x="124" y="22" width="30" height="160" rx="15" fill="#D9945A" ${S()}/>
      <path d="M132 44 l14 -10 M132 74 l14 -10 M132 104 l14 -10 M132 134 l14 -10 M132 164 l14 -10" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" opacity=".45"/>` },

  { n:"N5 · Jedna linija", d:"Jedna tanka linija u terakoti: para, B, zamah ispod i K koji se završava kašikom. Elegantno i moderno.",
    art:() => { const L = `fill="none" stroke="${C.main}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"`; return `
      <path d="M24 18 c-8 -7 6 -12 -1 -18 M40 18 c-8 -7 6 -12 -1 -18" ${L} stroke="${C.acc}" stroke-width="5"/>
      <path d="M30 182 V30 C80 24 102 40 98 62 C94 86 74 98 36 100 C96 98 116 120 108 146 C100 170 76 182 30 182 C64 196 112 198 128 182 V28" ${L}/>
      <path d="M130 106 L192 30" ${L}/>
      <path d="M132 108 L178 160" ${L}/>
      <ellipse cx="190" cy="174" rx="13" ry="18" transform="rotate(-42 190 174)" ${L} fill="${C.paper}"/>` } },

  { n:"N6 · Poslastičarnica", d:"B je ekler sa dve krofne (rupe krofni su „rupe“ slova B), K je od tri štapića oblande. Slatko i veselo.",
    art:() => {
      const donut = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${C.crust}" ${S()}/>
        <path d="M${x-r*0.86} ${y-r*0.1} C${x-r*0.7} ${y-r*0.9} ${x+r*0.7} ${y-r*0.95} ${x+r*0.88} ${y-r*0.05} C${x+r*0.8} ${y+r*0.35} ${x+r*0.62} ${y+r*0.1} ${x+r*0.5} ${y+r*0.42} C${x+r*0.3} ${y+r*0.75} ${x+r*0.12} ${y+r*0.3} ${x-r*0.1} ${y+r*0.6} C${x-r*0.4} ${y+r*0.9} ${x-r*0.5} ${y+r*0.2} ${x-r*0.86} ${y-r*0.1} Z" fill="${C.icing}" ${S(3.5)}/>
        <circle cx="${x}" cy="${y}" r="${r*0.3}" fill="${C.bg}" ${S()}/>
        <path d="M${x-r*0.5} ${y-r*0.45} l5 -3 M${x+r*0.2} ${y-r*0.62} l5 3 M${x+r*0.55} ${y-r*0.2} l2 6 M${x-r*0.2} ${y+r*0.45} l-5 2" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`;
      const wafer = (x, y, r, h) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-8" y="${-h}" width="16" height="${h}" rx="8" fill="${C.acc}" ${S()}/><path d="M-8 ${-h*0.25} l16 -10 M-8 ${-h*0.5} l16 -10 M-8 ${-h*0.75} l16 -10" stroke="${C.ink}" stroke-width="2.5" opacity=".4"/></g>`;
      return `
      ${donut(74, 60, 38)}${donut(80, 140, 44)}
      <rect x="22" y="18" width="30" height="166" rx="15" fill="${C.dough}" ${S()}/>
      <path d="M22 34 Q22 18 37 18 Q52 18 52 34 V120 Q44 112 37 124 Q30 112 22 120 Z" fill="${C.choc}" ${S(3.5)}/>
      ${wafer(140, 104, 38, 92)}${wafer(142, 110, 140, 86)}
      ${wafer(134, 186, 0, 166)}` } },
];

const main = (v) => `<svg class="main" viewBox="-20 -14 280 262"><rect x="-20" y="-14" width="280" height="262" fill="${C.bg}"/>
  <g transform="translate(0 4)">${v.art()}</g>
  <text x="120" y="236" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="30" letter-spacing="-1" fill="${C.ink}">Biljina Kuhinja</text></svg>`;
const tile = (v) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${C.bg}"/><g transform="translate(8 10) scale(.35)">${v.art()}</g></svg>`;
const fav = (v) => `<svg viewBox="-8 -4 252 204">${v.art()}</svg>`;

document.getElementById('g').innerHTML = V.map(v => `
  <div class="v">${main(v)}
    <h2>${v.n}</h2><p>${v.d}</p>
    <div class="small"><div class="tile">${tile(v)}</div><div class="fav">${fav(v)}</div></div>
  </div>`).join('');
</script>
</body>
</html>
